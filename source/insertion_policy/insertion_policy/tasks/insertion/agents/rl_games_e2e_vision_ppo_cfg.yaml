# END-TO-END VISUOMOTOR cfg (supervisor-locked 2026-07-30; RGB-only sim2real rebuild 2026-08-19).
# The real end-to-end policy: obs = wrist RGB (fully frozen ImageNet ResNet-18, 3-channel)
# + EE-frame wrist force (3) + prev_action (6) [+ pending socket-relative goal term], NO proprio.
# Asymmetric privileged critic (flat state, no CNN). LSTM + MLP; fixed_sigma; entropy 0. Consumes Dict obs
# (concate_obs_groups: False) via the insertion_hybrid network with cnn.backbone=resnet18. RGB-only: the
# depth branch is gone (3ch ResNet uses the pretrained RGB conv weights directly, no inflation). Run with
# --enable_cameras. Task: Isaac-Insertion-CoolingPeg-Iiwa-E2E-Vision-Direct-v0.

params:
  seed: 42
  algo:
    name: a2c_continuous

  env:
    clip_actions: 1.0
    clip_observations: 5.0
    # Policy sees force+prev_action (the "policy" group) + the wrist image; the asymmetric critic sees
    # the privileged state only. Dict mode so the image stays a (H,W,C) tensor for the encoder.
    obs_groups: { obs: [policy, image], states: [critic] }
    concate_obs_groups: False

  model:
    name: continuous_a2c_logstd

  network:
    name: insertion_hybrid
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True

    cnn:
      # Frozen ImageNet ResNet-18; RGB-only (3 channels), so conv1 keeps the pretrained RGB weights
      # verbatim (no depth-channel inflation). Its 512-d pooled feature is projected
      # to fc_size before fusing with force+prev_action (so the small proprio isn't swamped).
      backbone: resnet18
      pretrained: True
      # weights_path:  # optional local resnet18 state_dict if the box is offline (else random-init warn)
      # Fine-tune the top residual block (layer4) at a reduced effective LR (grad *= finetune_grad_scale).
      # Frozen stem stays under no_grad + BN in eval; keep torch_compile OFF (mixed_precision autocast only).
      finetune_tail: True
      finetune_grad_scale: 0.1
      fc_size: 128
      type: conv2d          # ignored by the resnet path; kept so rl_games' cnn parser is happy
      activation: relu
      initializer:
        name: default
      convs: []             # unused for resnet18 (the from-scratch Nature CNN path reads this)

    mlp:
      units: [512, 128, 64]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

    rnn:
      name: lstm
      units: 1024
      layers: 1
      before_mlp: True
      concat_input: True
      layer_norm: True

  load_checkpoint: False
  load_path: ""

  config:
    name: Forge
    device: cuda:0
    full_experiment_name: test
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    # Keep eager execution while debugging numerical integrity; it is easier to localize failures and avoids
    # compile-time memory overhead. torch.compile was ruled out as the source of the 2026-08-20 NaNs.
    torch_compile: False
    # rl_games' BF16 recurrent training path produced isolated catastrophic LSTM/Adam entries (1e32)
    # despite finite encoder features and gradient clipping. Keep PPO/LSTM updates in FP32; the frozen
    # ResNet encoder still runs under its own BF16 autocast in insertion_hybrid_network.py.
    mixed_precision: True   # plan requires AMP on (was False -> only got it via CLI override; now self-contained)
    normalize_input: True   # normalizes the policy vector + critic state; the image is pre-normalized in-env
    normalize_value: True
    value_bootstrap: True
    # Overwritten from the actual environment count by scripts/train.py.
    num_actors: 32
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.995
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.02     # see the state cfg (LR-cascade guard); fall back to constant LR if it cascades
    score_to_win: 20000
    max_epochs: 1500
    save_best_after: 10
    save_frequency: 100
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0       # THE FIX (2026-08-19): the last run stalled from pegged-HIGH entropy (the 0.003
                          # bonus over-inflated sigma so the policy kept exploring instead of committing to a
                          # seat). Back to 0 (fixed_sigma still gives baseline exploration via the log-std).
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 512
    mini_epochs: 4
    critic_coef: 2
    clip_value: True
    seq_length: 128
    bounds_loss_coef: 0.0001

    central_value_config:
      minibatch_size: 512
      mini_epochs: 4
      learning_rate: 1e-4
      lr_schedule: adaptive
      kl_threshold: 0.02
      clip_value: True
      normalize_input: True
      truncate_grads: True

      network:
        name: insertion_hybrid
        central_value: True

        mlp:
          units: [512, 128, 64]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None

        rnn:
          name: lstm
          units: 1024
          layers: 1
          before_mlp: True
          concat_input: True
          layer_norm: True

    player:
      deterministic: False
