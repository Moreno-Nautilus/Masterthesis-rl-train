# Vision variant of Forge's PPO config: hybrid CNN(image) + proprio policy, kept LSTM.
# Consumes Dict observations (concate_obs_groups: False) via the custom `insertion_hybrid` network.
# normalize_input is False: the image is normalized in-env and rl_games' RunningMeanStd does not
# play well with running-stats over pixels (cf. the Isaac Lab cartpole camera example).

params:
  seed: 0
  algo:
    name: a2c_continuous

  env:
    clip_actions: 1.0
    clip_observations: 5.0
    # Map Isaac Lab obs groups -> rl_games. Policy sees proprio + image; the asymmetric critic sees
    # the privileged state vector only. Dict mode so the image stays a (H,W,C) tensor for the CNN.
    obs_groups: { obs: [policy, image], states: [critic] }
    concate_obs_groups: False

  model:
    name: continuous_a2c_logstd

  network:
    name: insertion_hybrid
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: False

    cnn:
      type: conv2d
      activation: relu
      initializer:
        name: default
      # Project the flattened CNN features (3136) down to fc_size before fusing with the ~24 proprio
      # dims, so proprio is not swamped (24/152 instead of 24/3160 of the fused input).
      fc_size: 128
      # 4 conv layers for the 160px input: 160 ->39 ->18 ->16 ->7  => 7x7x64 = 3136 features
      # (a 3-layer Nature CNN would leave 16x16x64=16384, bloating the first LSTM layer).
      convs:
        - { filters: 32, kernel_size: 8, strides: 4, padding: 0 }
        - { filters: 64, kernel_size: 4, strides: 2, padding: 0 }
        - { filters: 64, kernel_size: 3, strides: 1, padding: 0 }
        - { filters: 64, kernel_size: 3, strides: 2, padding: 0 }

    mlp:
      units: [512, 128, 64]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

    rnn:
      name: lstm
      units: 1024
      layers: 2
      before_mlp: True
      concat_input: True
      layer_norm: True

  load_checkpoint: False
  load_path: ""

  config:
    name: Forge
    device: cuda:0
    full_experiment_name: test
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: True   # normalize proprio + privileged state (Forge needs it; force obs are large-magnitude). rl_games RunningMeanStdObs normalizes each dict key; the image is already pre-normalized in-env so this only re-standardizes it gently.
    normalize_value: True
    value_bootstrap: True
    num_actors: 128
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.995
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 20000
    max_epochs: 200
    save_best_after: 10
    save_frequency: 100
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 512  # batch size = num_envs * horizon_length; minibatch_size = batch_size / num_minibatches
    mini_epochs: 4
    critic_coef: 2
    clip_value: True
    seq_length: 128
    bounds_loss_coef: 0.0001

    central_value_config:
      minibatch_size: 512
      mini_epochs: 4
      learning_rate: 1e-4
      lr_schedule: adaptive
      kl_threshold: 0.008
      clip_value: True
      normalize_input: True   # critic sees the privileged state vector — normalize it (see policy note above)
      truncate_grads: True

      network:
        name: insertion_hybrid
        central_value: True

        mlp:
          units: [512, 128, 64]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None

        rnn:
          name: lstm
          units: 1024
          layers: 2
          before_mlp: True
          concat_input: True
          layer_norm: True

    player:
      deterministic: False
